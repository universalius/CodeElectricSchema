<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10" width="10" height="10">
  <!-- IEC 60617-3 (03-02-05): junction / connection point of conductors.
       A filled dot marks where crossing wires are electrically connected.
       (Crossing wires that are NOT connected are drawn without a dot.) -->
  <circle cx="5" cy="5" r="5" fill="currentColor" />
</svg>
