<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 20" width="60" height="20">
  <!-- European / IEC 60617 Standard Resistor Symbol (3:1 Body Aspect Ratio) -->
  <g stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="miter">
    <!-- Resistor Body (60px x 20px -> 3:1) -->
    <rect x="0" y="0" width="60" height="20" fill="transparent" />
  </g>
</svg>