<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 5 27 40" width="27" height="40">
  <!-- European / IEC 60617 Standard Photodiode (Without Leads) -->
  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Triangle (Anode pointing to Cathode - Identical 26x30 size) -->
    <polygon points="0,14 26,29 0,44" fill="currentColor" stroke-width="0" />
    <!-- Cathode Bar -->
    <line x1="26" y1="14" x2="26" y2="44" stroke-width="2" />
    
    <!-- Light Arrows Pointing Inward -->
    <!-- Left Arrow -->
    <line x1="20" y1="6" x2="12" y2="14" stroke-width="1.5" />
    <polygon points="11,15 16,14 12,10" fill="currentColor" stroke-width="0" />
    <!-- Right Arrow -->
    <line x1="26" y1="10" x2="18" y2="18" stroke-width="1.5" />
    <polygon points="17,19 22,18 18,14" fill="currentColor" stroke-width="0" />
  </g>
</svg>
