<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 5 27 40" width="27" height="40">
  <!-- European / IEC 60617 Standard LED (Without Leads) -->
  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Triangle (Anode pointing to Cathode - Identical 26x30 size) -->
    <polygon points="0,14 26,29 0,44" fill="currentColor" stroke-width="0" />
    <!-- Cathode Bar -->
    <line x1="26" y1="14" x2="26" y2="44" stroke-width="2" />
    
    <!-- Light Arrows Pointing Outward -->
    <!-- Left Arrow -->
    <line x1="12" y1="14" x2="20" y2="6" stroke-width="1.5" />
    <polygon points="21,5 16,6 20,10" fill="currentColor" stroke-width="0" />
    <!-- Right Arrow -->
    <line x1="18" y1="18" x2="26" y2="10" stroke-width="1.5" />
    <polygon points="27,9 22,10 26,14" fill="currentColor" stroke-width="0" />
  </g>
  </svg>