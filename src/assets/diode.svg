<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 30" width="26" height="30">
  <!-- European / IEC 60617 Standard Semiconductor Diode (Without Leads) -->
  <g stroke="currentColor" stroke-width="0" stroke-linecap="round" stroke-linejoin="round">
    <!-- Triangle (Anode pointing to Cathode) -->
    <polygon points="0,0 26,15 0,30" fill="currentColor" />
    <!-- Cathode Bar -->
    <line x1="26" y1="0" x2="26" y2="30" stroke-width="2" />
  </g>
</svg>